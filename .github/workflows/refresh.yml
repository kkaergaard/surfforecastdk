name: Refresh forecast data & deploy

# Runs ~3 h after each DMI model cycle (00/06/12/18 UTC). Can also be started
# manually from the Actions tab. Deploys the rebuilt site to Vercel production
# (https://dk-surf-forecast.vercel.app) — the laptop stays out of the loop.
on:
  schedule:
    - cron: "14 3,9,15,21 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: vercel-prod
  cancel-in-progress: true

jobs:
  refresh-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python deps (GRIB parsing)
        run: pip install cfgrib xarray

      - name: DMI WAM waves + wind (STAC bulk download)
        run: python backend/ingest_stac.py --budget-seconds 1500

      - name: Regional map fields
        run: python backend/export_fields.py

      - name: Long range (ECMWF/GFS via Open-Meteo)
        run: python backend/ingest_longrange.py --budget-seconds 300

      - name: Tides + hi-res wind + compose forecast.json
        run: python backend/ingest.py --budget-seconds 600

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # VERCEL_ORG_ID / VERCEL_PROJECT_ID link the CLI non-interactively to the
      # existing project; VERCEL_TOKEN must be added as a repo secret.
      - name: Deploy to Vercel (production)
        working-directory: frontend
        env:
          VERCEL_ORG_ID: team_vMLNcmrR6xv5EllRkmqxxDtk
          VERCEL_PROJECT_ID: prj_P7FXX9SxojgzLu7zxCcmhElR11dc
        run: npx vercel@latest deploy --prod --yes --token "${{ secrets.VERCEL_TOKEN }}"
